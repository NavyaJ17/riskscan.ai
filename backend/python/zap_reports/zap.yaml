env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - https://ecommerce-kto7.onrender.com/products
    - https://ecommerce-kto7.onrender.com/
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 1
    url: https://ecommerce-kto7.onrender.com/
  type: spider
- parameters:
    maxDuration: 5
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules: []
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: 1_zap.json
    reportTitle: ZAP Scanning Report
    template: traditional-json
  type: report
